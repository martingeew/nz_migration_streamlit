project:
  type: default

format:
  closeread-html:
    theme: flatly
    css: styles.css
    cr-style:
      narrative-background-color-overlay: "#1a1a1aee"
      narrative-text-color-overlay: "#f5f5f5"
      section-background-color: "#ffffff"
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
          <script>
            // Closeread stickies are stacked and mostly hidden, so Plotly sizes
            // them to its 700px default rather than to the column. Force a
            // resize once the layout settles and on every viewport change.
            (function () {
              function resizePlots() {
                document.querySelectorAll(".plotly-graph-div").forEach(function (d) {
                  if (window.Plotly) Plotly.Plots.resize(d);
                });
              }
              document.addEventListener("DOMContentLoaded", function () {
                setTimeout(resizePlots, 300);
              });
              window.addEventListener("resize", resizePlots);
            })();
          </script>

# No Python execution at render time — charts are pre-generated by make_charts.py
execute:
  enabled: false
